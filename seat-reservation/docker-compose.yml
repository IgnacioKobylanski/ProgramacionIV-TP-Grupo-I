services:
  postgres:
    image: postgres:16
    container_name: sr-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: sr-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloakdata:/opt/keycloak/data
      - ./infra/keycloak/seat-reservation-realm.json:/opt/keycloak/data/import/seat-reservation-realm.json:ro

volumes:
  pgdata:
  keycloakdata:  